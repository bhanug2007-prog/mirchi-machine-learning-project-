services:
  - type: web
    name: mirchimandi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REQUIRE_REMOTE_DB
        value: "1"
      - key: DB_URL
        sync: false
      - key: ADMIN_PASSCODE
        generateValue: true

  - type: web
    name: mirchimandi-frontend
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: VITE_API_URL
        value: https://mirchimandi.onrender.com
